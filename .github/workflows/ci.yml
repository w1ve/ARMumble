name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # ----------------------------------------------------------------
  # 0. Version consistency guard
  # ----------------------------------------------------------------

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify version sources agree
        shell: bash
        run: |
          set -euo pipefail
          TAURI=$(jq -r '.version' crates/mumble-tauri/tauri.conf.json)
          UI=$(jq -r '.version' crates/mumble-tauri/ui/package.json)
          PROTOCOL=$(grep -m1 -E '^version[[:space:]]*=' crates/mumble-protocol/Cargo.toml | sed -E 's/.*"(.+)".*/\1/')
          echo "tauri.conf.json:           $TAURI"
          echo "ui/package.json:           $UI"
          echo "mumble-protocol Cargo.toml: $PROTOCOL"
          if [ "$TAURI" != "$UI" ] || [ "$TAURI" != "$PROTOCOL" ]; then
            echo "::error::Version mismatch - tauri.conf.json/ui/package.json/mumble-protocol Cargo.toml must all agree."
            exit 1
          fi

  # ----------------------------------------------------------------
  # 1. Lint & test (runs on every push / PR)
  # ----------------------------------------------------------------

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      # -- Toolchain -----------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-test

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mumble-tauri/ui/package-lock.json

      # -- Linux system deps (Tauri + ALSA for cpal) --------------
      # nasm is required by rr-codec: openh264 builds from source and uses it
      # for its assembly kernels (up to ~3x faster encode/decode).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev protobuf-compiler nasm
          version: 1.0

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      # -- Frontend ------------------------------------------------
      - name: Install npm dependencies
        working-directory: crates/mumble-tauri/ui
        run: npm ci

      - name: TypeScript type-check
        working-directory: crates/mumble-tauri/ui
        run: npx tsc --noEmit

      - name: Frontend unit tests
        working-directory: crates/mumble-tauri/ui
        run: npm test

      # Build the shared UI dist so the RemoteRadioClient/Station binary
      # crates' `tauri::generate_context!()` can resolve `frontendDist`
      # (../mumble-tauri/ui/dist) during clippy's --all-targets compile.
      - name: Build frontend (shared UI dist)
        working-directory: crates/mumble-tauri/ui
        run: npm run build

      # -- Rust ----------------------------------------------------
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The real capture backends are feature-gated and off by default, so the
      # pass above never compiles them and they would rot unnoticed. Windows
      # only: DXGI Desktop Duplication exists nowhere else, and xcap needs a
      # display server the Linux runner does not have.
      - name: Clippy (capture backends, Windows only)
        if: runner.os == 'Windows'
        run: >-
          cargo clippy
          --package rr-capture --package rr-codec --all-targets
          --features rr-capture/screen-capture,rr-capture/dxgi-capture,rr-codec/real-capture,rr-codec/dxgi-capture
          -- -D warnings

      # openh264 assembles its SIMD kernels with nasm, and when nasm is missing
      # it *silently* falls back to pure C. Measured cost of that fallback:
      # encoding 1920x1200 went from ~17 ms to ~140 ms per frame, with no error
      # anywhere except one line in a build log nobody reads. Assert the line is
      # absent, so a broken nasm install fails the build instead of shipping a
      # 10x slower encoder.
      - name: Verify OpenH264 built its assembly kernels
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=(target/debug/build/openh264-sys2-*/output)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "::error::No openh264-sys2 build log found; cannot verify assembly was built."
            exit 1
          fi
          if grep -q "Failed to compile NASM files" "${logs[@]}"; then
            echo "::error::openh264 fell back to pure C - nasm is missing or failing. Encoding would be ~10x slower."
            exit 1
          fi
          echo "openh264 built with assembly kernels."

      - name: Rust unit tests (mumble-protocol)
        run: cargo test --package mumble-protocol --features opus-codec --lib

      - name: Rust unit tests (fancy-utils)
        run: cargo test --package fancy-utils --lib

      - name: Rust unit tests (mumble-tauri)
        run: cargo test --package mumble-tauri --lib

      # rr-webrtc's loopback test performs a real ICE handshake between two
      # in-process peers over localhost. It needs no display, no Mumble server
      # and no external network, so it is safe to run on every PR.
      - name: Rust unit tests (RemoteRadio crates)
        run: >-
          cargo test
          --package rr-proto
          --package rr-session
          --package rr-webrtc
          --package rr-capture
          --package rr-codec
          --package rr-hwcodec

      # rr-hwcodec is the only RemoteRadio crate allowed `unsafe`, by explicit
      # decision (Media Foundation is Win32 COM). Guard that: if a second rr-*
      # crate starts using it, this fails and the exception gets discussed rather
      # than spreading quietly.
      #
      # Scoped to crates/rr-* on purpose. The inherited mumble-* crates carry their
      # own narrower per-item unsafe exceptions for platform FFI (WASAPI, oboe,
      # glib, WebView2, signal-bridge), which predate this project and are not what
      # this check is about.
      - name: Verify the unsafe exception stays in rr-hwcodec
        shell: bash
        run: |
          set -euo pipefail
          offenders=$(grep -rln --include=Cargo.toml --include='*.rs' \
            -e 'allow(unsafe_code' crates/rr-* \
            | grep -v '^crates/rr-hwcodec/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::unsafe_code is allowed in an rr-* crate other than rr-hwcodec:"
            echo "$offenders"
            exit 1
          fi
          echo "unsafe_code remains confined to rr-hwcodec among the rr-* crates."

      # -- Integration tests (Linux only - Docker) ----------------
      - name: Start Mumble test server
        if: runner.os == 'Linux'
        working-directory: crates/mumble-protocol
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Integration tests
        if: runner.os == 'Linux'
        run: cargo test --package mumble-protocol --test integration

      - name: Stop Mumble test server
        if: runner.os == 'Linux' && always()
        working-directory: crates/mumble-protocol
        run: docker compose -f docker-compose.test.yml down

  # ----------------------------------------------------------------
  # 2. Build Tauri app (runs on every push / PR, parallel with test)
  # ----------------------------------------------------------------

  build:
    name: Build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Linux
            os: ubuntu-latest
            bundle-ext: "deb,appimage"
          - name: Windows
            os: windows-latest
            bundle-ext: "msi,nsis"

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target.os }}-build
          workspaces: |
            .
            crates/signal-bridge

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mumble-tauri/ui/package-lock.json

      # nasm is needed by openh264 (rr-codec), which builds from source.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev protobuf-compiler nasm
          version: 1.0

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Install npm dependencies
        working-directory: crates/mumble-tauri/ui
        run: npm ci

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Build the two branded RemoteRadio desktop binaries. Each binary crate
      # has its own tauri.conf.json (distinct productName/identifier) and runs
      # `cargo tauri build` from its own directory. The signal-bridge resource
      # lives in ../mumble-tauri/signal-bridge relative to each binary crate.
      - name: Build RemoteRadioClient
        working-directory: crates/app-client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: >-
            ${{ runner.os == 'Windows'
                && '{"bundle":{"resources":["../mumble-tauri/signal-bridge/*.dll"]}}'
                || runner.os == 'macOS'
                && '{"bundle":{"resources":["../mumble-tauri/signal-bridge/*.dylib"]}}'
                || '{"bundle":{"resources":["../mumble-tauri/signal-bridge/*.so"]}}' }}
        run: cargo tauri build --bundles ${{ matrix.target.bundle-ext }}

      - name: Build RemoteRadioStation
        working-directory: crates/app-station
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: >-
            ${{ runner.os == 'Windows'
                && '{"bundle":{"resources":["../mumble-tauri/signal-bridge/*.dll"]}}'
                || runner.os == 'macOS'
                && '{"bundle":{"resources":["../mumble-tauri/signal-bridge/*.dylib"]}}'
                || '{"bundle":{"resources":["../mumble-tauri/signal-bridge/*.so"]}}' }}
        run: cargo tauri build --bundles ${{ matrix.target.bundle-ext }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remote-radio-${{ matrix.target.name }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.AppImage.sig
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.msi.sig
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.exe.sig
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # 2b. Build Android APK (runs on every push / PR, parallel with test)
  # ----------------------------------------------------------------

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_PASSWORD_EFFECTIVE: ${{ secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest-android
          workspaces: |
            .
            crates/signal-bridge

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mumble-tauri/ui/package-lock.json

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: protobuf-compiler
          version: 1.0

      - name: Install npm dependencies
        working-directory: crates/mumble-tauri/ui
        run: npm ci

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      - name: Decode google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > crates/mumble-tauri/gen/android/app/google-services.json

      - name: Build signal-bridge for Android (arm64 + x86_64)
        working-directory: crates/signal-bridge
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CC_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang
          CC_x86_64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang
          CXX_x86_64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang++
          AR_x86_64_linux_android: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
        run: |
          cargo build --release --target aarch64-linux-android
          cargo build --release --target x86_64-linux-android

      - name: Place signal-bridge .so in jniLibs
        run: |
          mkdir -p crates/mumble-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p crates/mumble-tauri/gen/android/app/src/main/jniLibs/x86_64
          cp crates/signal-bridge/target/aarch64-linux-android/release/libsignal_bridge.so \
             crates/mumble-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
          cp crates/signal-bridge/target/x86_64-linux-android/release/libsignal_bridge.so \
             crates/mumble-tauri/gen/android/app/src/main/jniLibs/x86_64/

      - name: Prepare Android signing keystore
        id: android_signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' }}
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/android-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate Android signing keystore
        if: ${{ steps.android_signing.outputs.keystore_path != '' }}
        shell: bash
        run: |
          keytool -list \
            -keystore "${{ steps.android_signing.outputs.keystore_path }}" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Build Android APK
        working-directory: crates/mumble-tauri
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          ANDROID_KEYSTORE_PATH: ${{ steps.android_signing.outputs.keystore_path }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD_EFFECTIVE }}
        run: cargo tauri android build --apk

      - name: Verify Android .so (no unresolved C++ symbols)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          chmod +x scripts/check-android-so.sh
          ./scripts/check-android-so.sh

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fancy-mumble-Android
          path: |
            crates/mumble-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ----------------------------------------------------------------
  # 3. Release (only on push to main)
  # ----------------------------------------------------------------

  release:
    name: Release
    needs: [version-check, build, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' crates/mumble-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Generate latest.json for auto-updater
        id: latest_json
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          read_sig() { [ -f "$1" ] && cat "$1" || echo ""; }
          find_one() { find artifacts -type f -name "$1" | head -n1; }

          WIN_NSIS=$(find_one "*-setup.exe" || true)
          WIN_NSIS_SIG=$(find_one "*-setup.exe.sig" || true)
          LINUX_APPIMAGE=$(find_one "*.AppImage" || true)
          LINUX_APPIMAGE_SIG=$(find_one "*.AppImage.sig" || true)

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg win_url   "$BASE/$(basename "${WIN_NSIS:-missing}")" \
            --arg win_sig   "$(read_sig "${WIN_NSIS_SIG:-/dev/null}")" \
            --arg lin_url   "$BASE/$(basename "${LINUX_APPIMAGE:-missing}")" \
            --arg lin_sig   "$(read_sig "${LINUX_APPIMAGE_SIG:-/dev/null}")" \
            '{
              version: $version,
              notes: "See release notes on GitHub.",
              pub_date: $pub_date,
              platforms: (
                (if $win_sig != "" then {"windows-x86_64": {signature: $win_sig, url: $win_url}} else {} end)
                + (if $lin_sig != "" then {"linux-x86_64":   {signature: $lin_sig, url: $lin_url}} else {} end)
              )
            }' > latest.json
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fancy Mumble ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.apk
            artifacts/**/*.so
            artifacts/**/*.dll
            latest.json
