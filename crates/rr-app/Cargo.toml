[package]
name = "rr-app"
version = "0.4.0"
edition = "2021"
description = "Remote.Radio Mumble: audio-only stereo Mumble client for amateur radio."
license = "MIT"
default-run = "rrmumble"

[lib]
name = "rr_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rrmumble"
path = "src/main.rs"

[dependencies]
rr-client = { path = "../rr-client" }
rr-audio = { path = "../rr-audio" }
rr-radio = { path = "../rr-radio" }
tauri = { version = "2.10.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rr-audio-cpal = { path = "../rr-audio-cpal" }
rr-radio = { path = "../rr-radio", features = ["serial"] }
tauri-plugin-global-shortcut = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
