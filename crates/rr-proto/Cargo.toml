[package]
name = "rr-proto"
version = "0.1.0"
edition = "2021"
description = "RemoteRadio shared wire types: control, clipboard, and file-transfer messages exchanged over WebRTC data channels, plus signaling presence payloads."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
