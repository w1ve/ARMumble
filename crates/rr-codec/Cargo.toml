[package]
name = "rr-codec"
version = "0.1.0"
edition = "2021"
description = "RemoteRadio video codec: latency-tuned H.264 encoding and decoding for screen content, with keyframe-on-demand."
license = "MIT"

[dependencies]
rr-capture = { path = "../rr-capture" }

# BSD-2 licensed (both the Cisco core and the Rust wrapper), so it is safe to
# redistribute alongside this MIT codebase. The `source` feature builds
# OpenH264 from source rather than loading Cisco's prebuilt binary, which keeps
# deployment self-contained.
openh264 = { version = "0.9.8", features = ["source"] }

thiserror = "2"
tracing = "0.1"

# Hardware encoding is Windows-only and not optional there: at 4K the software
# encoder misses 30 fps by 2-4x, so a Windows Station should always prefer it.
[target.'cfg(windows)'.dependencies]
rr-hwcodec = { path = "../rr-hwcodec" }

[features]
default = []
# Lets the `capture_probe` example grab the real screen with the portable xcap
# backend. Off by default so headless CI builds this crate without pulling in
# xcap or needing a display.
real-capture = ["rr-capture/screen-capture"]
# Same, for the low-latency Windows DXGI Desktop Duplication backend. Enabling
# both makes the probe run and compare them side by side.
dxgi-capture = ["rr-capture/dxgi-capture"]

[lints]
workspace = true
