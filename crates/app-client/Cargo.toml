[package]
name = "app-client"
version = "0.3.0"
edition = "2021"
description = "Remote.Radio Mumble: a stereo Mumble client purpose-built for remote amateur-radio operating (SO2R, main/sub receivers)."
license = "MIT"
default-run = "rrmumble"

[[bin]]
name = "rrmumble"
path = "src/main.rs"

[dependencies]
# Shared application library (Tauri builder, commands, UI bridge, mode seam).
mumble_tauri_lib = { package = "mumble-tauri", path = "../mumble-tauri" }
tauri = { version = "2.10.1", features = ["protocol-asset", "tray-icon", "image-png"] }
# Referenced by the code `tauri::generate_context!()` expands to when the
# config contains a `plugins` section.
serde_json = "1"

# Tauri plugin crates. These are already used by the shared lib, but the
# capability/ACL resolution runs per *binary* at build time against this
# crate's own `capabilities/` dir, and it can only resolve a plugin's
# permission schema (e.g. `store:default`, `opener:default`) when that plugin
# is a direct dependency here. Without them the generated capabilities are
# empty and every plugin IPC call is denied at runtime — which hangs the UI on
# the loading splash because the preference store can never be read.
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Forwarded to the shared lib so client-only subsystems compile in.
custom-protocol = ["mumble_tauri_lib/custom-protocol"]

[lints]
workspace = true
