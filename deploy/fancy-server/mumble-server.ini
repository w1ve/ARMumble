; Fancy Mumble server configuration — RemoteRadio profile.
;
; Copied to /data/mumble-server.ini on first run and NOT overwritten after
; that, so edits survive container restarts and image rebuilds.

; ---------------------------------------------------------------------------
;  Network
; ---------------------------------------------------------------------------
; 54736 as requested. Note Mumble's own default is 64738 — if 54736 was a slip
; for that, this is the one line to change.
port=54736

; Leave empty to bind all interfaces; Docker handles the mapping.
host=

; ---------------------------------------------------------------------------
;  Bandwidth — the setting that matters for stereo
; ---------------------------------------------------------------------------
; Mumble's packaged default is 72000, which is NOT advisory: Server::processMsg
; charges every packet against a 360-slot rolling window
; (BandwidthRecord::addFrame) and silently suppresses anything over budget.
; Measured on a stock 1.5.915 server at 72000: sending 450 frames of 128 kbps
; stereo delivered exactly 360 — the ring size — then packets started vanishing
; after about 7 seconds. A RemoteRadio Station transmits continuously, so that
; failure mode is guaranteed rather than theoretical.
;
; 192000 covers sustained 128 kbps Opus at 20 ms frames. The arithmetic the
; server uses is 20+8+4 bytes of overhead per packet, so 128 kbps needs
; 352 B x 50/s = 17 600 B/s = 140 800 bps; 192000 leaves room for 160 kbps.
;
; The code's own ceiling is 558000, documented in Meta.cpp as
; "510000 (Opus) + 9600 (position) + 38400 (TCP overhead)" — there is no 128 kbps
; cap, contrary to widely repeated folklore.
bandwidth=192000

; ---------------------------------------------------------------------------
;  Users and channels
; ---------------------------------------------------------------------------
users=100
usersperchannel=0

welcometext="<b>RemoteRadio</b> — Fancy Mumble server.<br />Stereo-capable, peer-to-peer signalling enabled."

; ---------------------------------------------------------------------------
;  Audio
; ---------------------------------------------------------------------------
; Force Opus for every client. The server never transcodes — it relays
; opus_data as an opaque blob, which is exactly why stereo passes through
; untouched — but a zero threshold stops legacy CELT negotiation entirely.
opusthreshold=0

; ---------------------------------------------------------------------------
;  Storage
; ---------------------------------------------------------------------------
; On the mounted volume so the database outlives the container. 1.6 uses a new
; schema; if you ever point this at a copy of a 1.5 database it will migrate it
; in place, so copy rather than move.
database=/data/mumble-server.sqlite

; Empty logfile means log to stdout, which is what `docker logs` wants.
logfile=

; ---------------------------------------------------------------------------
;  TLS
; ---------------------------------------------------------------------------
; Left blank so the server generates and stores a self-signed certificate on
; first start. Mumble clients use trust-on-first-use, so that is normal and not
; a downgrade. Point these at real PEM files if you want a CA-signed cert.
sslCert=
sslKey=

; ---------------------------------------------------------------------------
;  Access
; ---------------------------------------------------------------------------
; No server password by default — set one here, or pass MUMBLE_SERVER_PASSWORD
; to the container and the entrypoint will write it.
serverpassword=

; Allow clients without a certificate. Turn on if you want every user to have a
; persistent identity.
certrequired=false

allowhtml=true
registerName=RemoteRadio

; ---------------------------------------------------------------------------
;  Ice RPC — administration interface
; ---------------------------------------------------------------------------
; `ice` is the endpoint. The server reads it, and copies every key in the [Ice]
; group below into Ice's own property set. Loopback by default so the admin
; surface is NOT exposed off-host: reach it by SSHing to the host, or override
; the endpoint via MUMBLE_ICE_ENDPOINT (and firewall it) if you must.
ice=tcp -h 127.0.0.1 -p 6502

; Write secret — required to make *changes* over Ice (setConf, add users, etc.).
; A read-only connection without this can still query. Set from
; MUMBLE_ICE_SECRET_WRITE by the entrypoint if provided; the literal here is a
; fallback for a hand-run container.
icesecretwrite=remoteRadioIce

[Ice]
; Ice's own endpoint for callbacks from admin clients. Loopback, same reasoning.
Ice.Default.Locator=
Ice.Warn.UnknownProperties=1
Ice.MessageSizeMax=65536
